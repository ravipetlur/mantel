# CodeQL code scanning of the GitHub Actions workflows (the `actions` language): script injection, unpinned or
# untrusted actions, over-broad permissions and the like.
#
# Swift isn't analyzed yet: CodeQL supports Swift only up to 6.3.2, and Mantel builds with Swift 6.4. Add `swift` once
# CodeQL supports 6.4; it needs its own job on the xcode-27 runner with `build-mode: manual` running `make build`.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays at 04:27 UTC, so new queries also look at code that hasn't changed.
    - cron: '27 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (actions)
    # Workflow files need no Mac.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:actions
